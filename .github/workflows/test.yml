name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pulse_notifications_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.13
          cache: npm

      - run: npm ci

      - name: Run unit, database, and two-instance end-to-end tests
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          DB_USER: postgres
          DB_PASSWORD: testpassword
          DB_NAME: pulse_notifications_test
          DB_HOST: localhost
          DB_PORT: 5433
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_secret
          PORT: 3000
          OUTBOX_POLL_INTERVAL_MS: 100

      - name: Build production container image
        run: docker build --tag pulse-notification-engine:test .