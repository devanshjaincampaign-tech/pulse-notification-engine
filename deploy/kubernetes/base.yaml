apiVersion: v1
kind: Namespace
metadata:
  name: pulse
  labels:
    app.kubernetes.io/part-of: pulse-notification-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-production-config
  namespace: pulse
data:
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres.example.internal
  DB_PORT: "5432"
  DB_NAME: pulse_notifications
  DB_POOL_MAX: "15"
  DB_SSL: "true"
  DB_SSL_REJECT_UNAUTHORIZED: "true"
  DB_SSL_CA_FILE: ""
  REDIS_HOST: redis.example.internal
  REDIS_PORT: "6380"
  REDIS_TLS: "true"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_FROM: Pulse Notifications <no-reply@example.com>
  CORS_ORIGIN: https://app.example.com
  OUTBOX_POLL_INTERVAL_MS: "1000"
  OUTBOX_BATCH_SIZE: "20"
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_RETRY_BASE_DELAY_MS: "500"
  OUTBOX_RETRY_MAX_DELAY_MS: "30000"
  OUTBOX_LEASE_MS: "60000"
  WS_MAX_CONNECTIONS_PER_IP: "10"
  WS_MAX_HANDSHAKES_PER_MINUTE: "60"
  WS_MAX_MESSAGES_PER_MINUTE: "120"
  WS_MAX_PAYLOAD_BYTES: "65536"
  WS_TRUST_PROXY: "true"
  WORKER_HEALTH_PORT: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-api
  namespace: pulse
spec:
  selector:
    app: pulse-api
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-outbox-worker
  namespace: pulse
spec:
  selector:
    app: pulse-outbox-worker
  ports:
    - name: metrics
      port: 3001
      targetPort: health
  type: ClusterIP
